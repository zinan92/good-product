- id: gp-002
  catalog_no: "GP-002"
  title: "让人觉得像奖励的空收件箱"
  kind: inspiration
  note: >
    不说一句泛泛的“这里什么都没有”——用一幅小插画和一句文案，回应你刚刚完成的工作。
    值得借鉴的是它的语气，不只是布局。
  tags: [empty-state, illustration, microcopy]
  image: images/pending.svg
  collected_at: "2026-08-14"
  source_url: null

- id: gp-003
