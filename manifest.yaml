- id: gp-006
  catalog_no: "GP-006"
  title: "把命令面板当作入口"
  kind: tool
  note: >
    所有操作都能从一个搜索框进入，并按最近使用排序。团队习惯 Cmd+K 后，甚至不再打开侧边栏——
    这说明导航是后备入口，而不是产品本身。
